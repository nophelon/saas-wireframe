// acode_run("acode", "default_pcode")

(function(acodeExports) {

    function acode_set ( acode, elem ){
        var button = document.querySelector(elem);
        button.addEventListener("click", function(){ acode_run( acode )} );
    }

    sendByBeacon = function(data) {
        navigator.sendBeacon("/collect_v2/acode.php", JSON.stringify(data));
    };

    sendByXhr = function(data) {
        xhr.open("POST", "/collect_v2/acode.php");
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify(data));
    };

    function acode_run ( acode, def_p ){

        var xhr = new XMLHttpRequest();
        var pcode = getParameterByName("pcode") || def_p;

        if( !pcode || !gcode || !acode){
            console.warn("essention code is empty");
            return;
        }

        var data = {
            "gcode" : gcode,
            "pcode" : pcode,
            "acode" : acode
        };

        !!navigator.sendBeacon ? sendByBeacon(data) : sendByXhr(data);
    }

    function getParameterByName(name) {
        let url = window.location.href;

        name = name.replace(/[\[\]]/g, '\\$&');
        var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
            results = regex.exec(url);
        if (!results) return null;
        if (!results[2]) return '';
        return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    acodeExports.acode_run = acode_run;
    acodeExports.acode_set = acode_set;
