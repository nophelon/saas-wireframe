<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOPHELON 디자인 스킨 갤러리 — 검증</title>
<style>
:root{--bg:#0b0d12;--card:#161a22;--line:#242a36;--tx:#e8ecf3;--dim:#8a93a6;--acc:#5b8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Pretendard',system-ui,-apple-system,sans-serif;line-height:1.5}
header{padding:34px 40px 18px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--dim);margin-top:6px;font-size:14px}
main{padding:12px 40px 60px;max-width:1500px;margin:0 auto}
section{margin-top:34px}
h2{font-size:17px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.cnt{font-size:12px;color:var(--dim);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.thumb{aspect-ratio:16/9;background:#0f1218;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px}
.nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sz{font-size:11px;color:var(--dim);flex-shrink:0}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--card:#fff;--line:#e5e8ee;--tx:#1a1d24;--dim:#6b7280}}
</style></head><body>
